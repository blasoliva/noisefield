name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libgl1-mesa-dev libcurl4-openssl-dev

      - name: Cache fetched dependencies (JUCE, Catch2, CLAP)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Fetch*.cmake') }}

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DNOISEFIELD_BUILD_TESTS=ON
          -DNOISEFIELD_BUILD_PLUGIN=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check plugin artefacts
        run: |
          base=build/src/plugin/NoisefieldPlugin_artefacts/RelWithDebInfo
          test -e "$base/VST3/Noisefield.vst3"
          test -e "$base/LV2/Noisefield.lv2"
          test -e "$base/CLAP/Noisefield.clap"

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install clang-format
        # Pinned so CI and local runs format identically.
        run: pip install "clang-format==23.1.0"
      - name: Check formatting
        run: ./scripts/check-format.sh
