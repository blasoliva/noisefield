<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- noise field: scattered vertical ticks of varying height -->
  <g stroke="#4b5563" stroke-width="6" stroke-linecap="round" opacity="0.65">
    <line x1="96"  y1="256" x2="96"  y2="212"/>
    <line x1="128" y1="256" x2="128" y2="300"/>
    <line x1="160" y1="256" x2="160" y2="224"/>
    <line x1="192" y1="256" x2="192" y2="288"/>
    <line x1="224" y1="256" x2="224" y2="204"/>
    <line x1="288" y1="256" x2="288" y2="312"/>
    <line x1="320" y1="256" x2="320" y2="220"/>
    <line x1="352" y1="256" x2="352" y2="296"/>
    <line x1="384" y1="256" x2="384" y2="232"/>
    <line x1="416" y1="256" x2="416" y2="284"/>
  </g>

  <!-- primary tone: a sine wave across the field -->
  <path d="M64 256 C 112 128, 176 128, 224 256 S 336 384, 384 256 S 448 160, 448 160"
        fill="none" stroke="url(#wave)" stroke-width="20" stroke-linecap="round"/>
</svg>
